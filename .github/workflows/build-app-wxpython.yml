name: Build - OpenCore Patcher Nightly (.pkg Auto)

on:
  workflow_dispatch:
  push:
    branches:
      - macos-next

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt || true
          python3 -m pip install wxPython pyinstaller macholib || true

      - name: Build OpenCore Patcher GUI
        run: |
          echo "🚀 Starting OCLP GUI build..."
          chmod +x OpenCore-Patcher-GUI.command || true
          ./OpenCore-Patcher-GUI.command --build || python3 OpenCore-Patcher-GUI.command --build
          echo "✅ Build complete."

      - name: Locate built app
        id: locate
        run: |
          echo "🔍 Searching for built .app..."
          find . -type d -name "*.app" -maxdepth 6 || true
          APP_PATH=$(find . -type d -name "OpenCore-Patcher.app" -maxdepth 6 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ No exact match found, trying any .app"
            APP_PATH=$(find . -type d -name "*.app" -maxdepth 6 | head -n 1)
          fi
          echo "Found app path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found after build. Check build logs!" && exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Prepare .pkg contents
        run: |
          mkdir -p dist/root/Applications
          cp -R "${{ steps.locate.outputs.app_path }}" dist/root/Applications/
          echo "📦 Copied app into package root."
          ls -lh dist/root/Applications

      - name: Create .pkg installer
        run: |
          echo "📦 Creating .pkg installer..."
          pkgbuild \
            --root dist/root \
            --identifier com.opencore.legacy.patcher \
            --version 3.0.0-nightly \
            --install-location / \
            dist/OpenCore-Patcher-Nightly.pkg
          echo "✅ .pkg created successfully."
          ls -lh dist/

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Nightly
          path: dist/OpenCore-Patcher-Nightly.pkg
          retention-days: 14
