name: Build - OpenCore Patcher Nightly (.pkg Auto)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt || true
          python3 -m pip install wxPython pyinstaller macholib || true

      - name: Build OpenCore Patcher GUI
        run: |
          echo "🚀 Building OCLP GUI (new method)..."
          python3 Build-Binary.py --gui
          echo "✅ Build complete."

      - name: Debug file tree
        run: |
          echo "---- BUILD TREE ----"
          find . -maxdepth 4 -type d
          echo "---- FILES ----"
          find . -type f -maxdepth 4 | grep -E "OpenCore|.pkg|.app|.py" || true

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(find . -type d -name "OpenCore-Patcher.app" -maxdepth 6 | head -n 1)
          echo "Found: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ Build failed, no .app found!" && exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Prepare .pkg
        run: |
          mkdir -p dist/root/Applications
          cp -R "${{ steps.locate.outputs.app_path }}" dist/root/Applications/
          ls -lh dist/root/Applications

      - name: Create .pkg installer
        run: |
          pkgbuild \
            --root dist/root \
            --identifier com.opencore.legacy.patcher \
            --version 3.0.0-nightly \
            --install-location / \
            dist/OpenCore-Patcher-Nightly.pkg
          ls -lh dist/

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Nightly
          path: dist/OpenCore-Patcher-Nightly.pkg
          retention-days: 14
