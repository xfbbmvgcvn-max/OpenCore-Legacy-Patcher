name: Build - OpenCore Patcher Nightly (Auto .pkg)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install wxPython pyinstaller macholib || true

      - name: Build OpenCore Patcher GUI
        run: |
          echo "🚀 Building OCLP GUI..."
          python3 Build-Binary.py --gui
          echo "✅ Build complete."

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(find . -type d -name "OpenCore-Patcher.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found after build!" && exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package .pkg
        run: |
          mkdir -p dist/root/Applications
          cp -R "${{ steps.locate.outputs.app_path }}" dist/root/Applications/
          pkgbuild \
            --root dist/root \
            --identifier com.opencore.legacy.patcher \
            --version 3.0.0-nightly \
            --install-location / \
            dist/OpenCore-Patcher-Nightly.pkg
          echo "✅ .pkg created successfully."
          ls -lh dist/

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Nightly
          path: dist/OpenCore-Patcher-Nightly.pkg
          retention-days: 14
