name: Build - OpenCore Patcher Nightly (.pkg Auto Build)

on:
  workflow_dispatch:
  push:
    branches:
      - macos-next

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt || true
          python3 -m pip install wxPython pyinstaller macholib || true

      - name: Build OpenCore Patcher GUI
        run: |
          echo "Starting OCLP GUI build..."
          chmod +x OpenCore-Patcher-GUI.command || true
          ./OpenCore-Patcher-GUI.command --build || python3 OpenCore-Patcher-GUI.command --build
          echo "Build complete."

      - name: List files after build
        run: ls -R

      - name: Prepare .pkg contents
        run: |
          mkdir -p dist/root/usr/local/OpenCore-Patcher
          if [ -d "build" ]; then
            cp -R build/* dist/root/usr/local/OpenCore-Patcher/ || true
          fi
          if [ -d "dist" ]; then
            cp -R dist/*.app dist/root/usr/local/OpenCore-Patcher/ || true
          fi
          if [ -f "OpenCore-Patcher.app" ]; then
            cp -R OpenCore-Patcher.app dist/root/usr/local/OpenCore-Patcher/
          fi
          echo "Files prepared for packaging."

      - name: Create .pkg installer
        run: |
          pkgbuild \
            --root dist/root \
            --identifier com.opencore.legacy.patcher \
            --version 3.0.0-nightly \
            --install-location /Applications \
            dist/OpenCore-Patcher-Nightly.pkg

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Nightly
          path: dist/OpenCore-Patcher-Nightly.pkg
          retention-days: 14
